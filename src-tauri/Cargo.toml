[package]
name = "marie-lookup"
version = "2.0.0-rc.14"
description = "Tray-resident text snippet lookup with paste-at-cursor"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "marie_lookup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
enigo = "0.2"
arboard = "3"
tokio = { version = "1", features = ["time"] }
# default-features off: the default rustls-tls pulls in `ring`, whose C build
# script breaks under cargo-xwin (/imsvc flags fed to plain clang). native-tls
# uses the OS TLS stack instead — schannel on Windows, Security.framework on
# macOS — nothing to cross-compile.
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["native-tls", "zip"] }
serde_json = "1.0.150"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"

[dev-dependencies]
# Temp SQLite files for the DB tests (CLAUDE.md mandates a real temp DB, never
# a mock). Dev-only — never linked into the shipped binary.
tempfile = "3"
