<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Marie Lookup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="lookup">
    <div class="lookup-search">
      <input id="search" type="text" placeholder="Search entries…" autofocus />
    </div>
    <div id="matches" class="lookup-matches"></div>
    <div id="body" class="lookup-body empty">Type to search.</div>
    <div class="lookup-hint">
      <kbd>Enter</kbd> paste selection · <kbd>↑</kbd>/<kbd>↓</kbd> switch match · <kbd>Esc</kbd> cancel
    </div>
    <script src="lookup.js"></script>
  </body>
</html>
