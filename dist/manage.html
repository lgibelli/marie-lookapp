<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Marie Lookup — Manage Entries</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="manage">
    <aside class="sidebar">
      <div class="sidebar-head">
        <button id="new-btn">+ New</button>
        <input id="filter" type="text" placeholder="Filter…" />
      </div>
      <div id="list" class="sidebar-list"></div>
      <div id="trash-section" class="trash-section hidden">
        <button id="trash-toggle">Deleted ▸</button>
        <div id="trash-list" class="trash-list hidden"></div>
      </div>
      <div class="sidebar-foot">
        <label>
          <input type="checkbox" id="autostart" />
          Launch at login
        </label>
        <div class="backup-block">
          <div id="backup-status" class="backup-status">Backups: …</div>
          <div class="backup-actions">
            <button id="backup-now">Back up now</button>
            <button id="backup-folder" title="Choose where backups are stored (point it at a OneDrive/iCloud folder for off-site copies)">Folder…</button>
            <button id="backup-restore">Restore…</button>
          </div>
        </div>
      </div>
    </aside>
    <main class="editor">
      <div class="editor-placeholder">
        Select an entry on the left, or click <strong>+ New</strong> to add one.
      </div>
      <div class="editor-head">
        <input id="title" class="title" type="text" placeholder="Title" />
        <button id="history-btn" title="View previous versions of this entry">↺</button>
        <button id="delete-btn" class="danger" title="Move to Deleted (restorable for 90 days)">🗑</button>
        <button id="restore-btn" class="primary" title="Restore this entry from Deleted">Restore</button>
        <button id="save-btn" class="primary">Save</button>
      </div>
      <div id="history-bar" class="history-bar hidden">
        <span id="history-info"></span>
        <span class="history-nav">
          <button id="history-older">‹ Older</button>
          <button id="history-newer">Newer ›</button>
          <button id="history-exit" class="primary">Exit</button>
        </span>
      </div>
      <textarea id="body" class="body" placeholder="Body…"></textarea>
    </main>
    <script src="manage.js"></script>
  </body>
</html>
