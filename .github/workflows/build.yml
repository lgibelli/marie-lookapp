name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore MarieLookApp/MarieLookApp.csproj

      - name: Publish ${{ matrix.arch }}
        run: |
          dotnet publish MarieLookApp/MarieLookApp.csproj `
            -c Release `
            -r win-${{ matrix.arch }} `
            -p:PublishSingleFile=true `
            -p:SelfContained=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarieLookApp-win-${{ matrix.arch }}
          path: publish/win-${{ matrix.arch }}/

  create-installer:
    needs: build
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: MarieLookApp-win-${{ matrix.arch }}
          path: publish/win-${{ matrix.arch }}/

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=${{ matrix.arch }} Installer/setup.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MarieLookApp-${{ matrix.arch }}-Setup
          path: Installer/Output/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: create-installer
    runs-on: ubuntu-latest

    steps:
      - name: Download x64 installer
        uses: actions/download-artifact@v4
        with:
          name: MarieLookApp-x64-Setup
          path: installers/

      - name: Download arm64 installer
        uses: actions/download-artifact@v4
        with:
          name: MarieLookApp-arm64-Setup
          path: installers/

      - name: Create Release on public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          gh release create "$TAG_NAME" \
            --repo lgibelli/marie-lookapp-releases \
            --title "Marie LookApp $TAG_NAME" \
            --generate-notes \
            installers/*.exe
