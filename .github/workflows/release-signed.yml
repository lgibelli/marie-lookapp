name: Signed release

# Publishes the SIGNED + NOTARIZED release. Triggers on a push to a release/**
# branch (only maintainers with push access can create those — a fork PR canNOT,
# so the signing secrets stay safe), or manually from the Actions tab. This job
# has access to the signing secrets; never make it reachable from pull_request /
# pull_request_target. Release flow:
#   1. Bump the version in tauri.conf.json + package.json + Cargo.toml(+lock).
#   2. Push a release/<version> branch (e.g. release/2.0.0) — or run manually.
# It mirrors the local scripts/release.sh exactly — CI only provisions the keys
# (Developer ID cert + notary API key + minisign updater key) and toolchain, then
# calls that script, which signs the .app with Developer ID, notarizes + staples
# the .app and the DMG, and publishes. Windows stays UNSIGNED (SKIP_AUTHENTICODE=1).
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (shown in latest.json + the GitHub release)"
        required: true
        default: "Marie LookApp release"

# Run the JS actions (checkout, cache, rust-cache, setup-node) on Node 24 —
# matches test.yml and silences the Node 20 deprecation notice.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Single-repo publish (binaries + latest.json land on THIS repo), so the
# built-in GITHUB_TOKEN suffices — no cross-repo PAT. It needs contents:write
# to create the release.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14            # arm64 — matches the darwin-aarch64 updater artifact
    environment: release         # add required reviewers in Settings → Environments → release
    steps:
      - uses: actions/checkout@v6

      - name: Add Windows cross-targets
        run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      # Cache target/ + the cargo registry so reruns don't recompile the whole
      # Tauri dep tree for all three builds (two Windows triples + macOS). First
      # run is cold; later runs restore. (Mirrors test.yml; distinct cache via
      # the macOS runner + key.)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: signed-release

      - name: Cache cargo-xwin MSVC CRT/SDK (~700 MB)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/cargo-xwin
          key: cargo-xwin-${{ runner.os }}-v1

      - name: Cache the cargo-xwin binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-bin-${{ runner.os }}-v1

      - name: Install toolchain (cargo-xwin, NSIS, llvm-rc, osslsigncode)
        run: |
          brew install nsis llvm osslsigncode
          command -v cargo-xwin >/dev/null || cargo install --locked cargo-xwin

      - name: Setup Node + Tauri CLI
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci

      - name: Import macOS signing identity into a throwaway keychain
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KEYCHAIN"
          # Put our keychain first in the search list so `codesign --sign "Marie
          # Lookup Signing"` resolves the identity; keep the login keychain too.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write updater (minisign) key
        env:
          UPDATER_KEY: ${{ secrets.TAURI_UPDATER_KEY }}
        run: |
          mkdir -p ~/.tauri
          printf '%s' "$UPDATER_KEY" > ~/.tauri/marie-lookup-updater.key

      - name: Write notary (App Store Connect) API key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"

      - name: Build, sign & publish (scripts/release.sh)
        env:
          SKIP_AUTHENTICODE: "1"                          # Windows stays unsigned (as today)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}           # built-in token; publishes to this repo
          # macOS Developer ID sign + notarize. Identity/team are non-secret repo
          # Variables; the notary key is the .p8 written above + its id/issuer.
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Pass notes via env (never interpolate ${{ }} into a run: shell — a
          # crafted value could inject commands into this secret-bearing job).
          # On a release/** push there's no input, so fall back to the branch name.
          NOTES: ${{ inputs.notes || format('Marie LookApp release ({0})', github.ref_name) }}
        run: scripts/release.sh "$NOTES"
